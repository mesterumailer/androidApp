name: Android Build

on:
  pull_request:
  push:
    branches:
      - main
      - 'feature/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Node.js for Cloudflare Worker tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test Cloudflare Ads Worker
        working-directory: cloudflare-ad-worker
        run: npm test

      - name: Validate D1 migration and embedded banner image
        run: |
          python - <<'PY'
          import base64
          import pathlib
          import sqlite3

          db = sqlite3.connect(":memory:")
          for migration in sorted(pathlib.Path("cloudflare-ad-worker/migrations").glob("*.sql")):
              db.executescript(migration.read_text(encoding="utf-8"))
          row = db.execute(
              "SELECT title, target_url, image_mime, image_base64, weight, impressions FROM ads WHERE slug = ?",
              ("yajing-chinese",),
          ).fetchone()
          assert row is not None, "Initial Yajing ad was not seeded"
          assert row[0] == "آموزش زبان چینی"
          assert row[1] == "https://yajingchinese.ir"
          assert row[2] == "image/webp"
          image = base64.b64decode(row[3], validate=True)
          assert image[:4] == b"RIFF" and image[8:12] == b"WEBP", "Seeded image is not a WebP file"
          assert row[4] == 3, "Yajing default rotation weight should be 3"
          assert row[5] == 0, "New migration should start with zero impressions"
          rotation = db.execute("SELECT counter FROM ads_rotation_state WHERE placement = ?", ("home_bottom",)).fetchone()
          assert rotation == (0,), "Rotation state was not initialized"
          print(f"D1 migrations and Yajing banner are valid; banner image is {len(image)} bytes")
          PY

      - name: Build debug APK and run unit tests
        run: gradle testDebugUnitTest assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: sms-manager-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
